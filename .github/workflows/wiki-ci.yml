name: Wiki CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  wiki-checks:
    name: Wiki checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate provenance and capture history
        env:
          TRUSTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/wiki_provenance.py staged
          python3 scripts/wiki_provenance.py ci --trusted-base "$TRUSTED_BASE"
          python3 scripts/check_capture_diff.py --base "$TRUSTED_BASE" --head HEAD

      - name: Run wiki eval suite
        run: python3 scripts/wiki_eval.py --profile portable
