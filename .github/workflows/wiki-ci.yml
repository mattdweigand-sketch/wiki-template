name: Wiki CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  wiki-checks:
    name: Wiki checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Test one-time initializer
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/wiki_setup_initializer_test.py

      - name: Run wiki eval suite
        run: python3 scripts/wiki_eval.py

      - name: Run Tier-1 lint
        run: python3 scripts/lint.py --tier1
